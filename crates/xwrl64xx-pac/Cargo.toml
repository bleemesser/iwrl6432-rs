[package]
name = "xwrl64xx-pac"
version = "0.6.0"
authors = ["Abram Haich", "bleemesser"]
edition = "2018"
homepage = "https://github.com/bleemesser/iwrl6432-rs"
description = "Owned PAC for the TI xWRL64xx, forked from abeanater/xwrl64xx-pac and extended with an interrupt vector table"
license = "MIT"
repository = "https://github.com/bleemesser/iwrl6432-rs"

# no_std target has no `test` crate; keep --all-targets (rust-analyzer flycheck) buildable
[lib]
test = false
bench = false

[dependencies]
cortex-m = "0.7.3"
vcell = "0.1.3"

[dependencies.cortex-m-rt]
optional = true
version = ">=0.6.15,<0.8"

[dependencies.critical-section]
optional = true
version = "1.0.0"

[features]
rt = ["cortex-m-rt/device"]
